name: NEXA Ecosystem CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all packages and apps
        run: npm run typecheck

      - name: Lint all code
        run: npm run lint

      - name: Run automated test suite
        run: npm run test

      - name: Build packages and applications
        run: npm run build
